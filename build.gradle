buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "net.serenity-bdd:serenity-gradle-plugin:4.2.34"
    }
}

plugins {
    id 'io.github.jumosqu12.screenplayarchitecture' version '2.0.1'
    id 'java'
    id 'eclipse'
    id 'idea'
}

apply plugin: 'net.serenity-bdd.serenity-gradle-plugin'

group 'com.saucedemo.certificacion'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    serenityVersion = '4.2.34'
    serenityCucumberVersion = '4.2.34'
    lombokVersion = '1.18.22'
    junit = '4.13.2'
    hamcrest = '1.3'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-junit:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-cucumber:${serenityCucumberVersion}"
    implementation 'org.slf4j:slf4j-simple:2.0.5'
    implementation "net.serenity-bdd:serenity-screenplay-rest:${serenityVersion}"

    testImplementation "junit:junit:${junit}"
    testImplementation "org.hamcrest:hamcrest-all:${hamcrest}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"

    implementation group: 'org.apache.commons', name: 'commons-dbcp2', version: '2.12.0'
}

serenity {
    reports = ["single-page-html"]
}

tasks.named('test') {
    testLogging.showStandardStreams = true
    systemProperty "file.encoding", "UTF-8"
}

test.finalizedBy(aggregate)